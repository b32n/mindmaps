name = "mindmaps"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# One Worker serves both the API and the built React app.
#
# This is not just tidiness. The OAuth consent screen at /oauth/authorize reads
# the board's session cookie to know who is approving. Split the app and the API
# across two sites and that cookie is either dropped (SameSite=Lax) or has to be
# weakened to SameSite=None. One origin keeps the cookie honest, removes CORS
# from the picture entirely, and gives a clean MCP endpoint to paste into a
# harness: https://mindmaps.b32n.io/mcp
[[routes]]
pattern = "mindmaps.b32n.io"
custom_domain = true

# The mindbox: HTML artefacts run here and nowhere else.
#
# Not tidiness: the app origin holds the session cookie, and `HttpOnly` does
# nothing to stop same-origin script doing `fetch("/api/boards", {credentials:
# "include"})`. An author-written page running on mindmaps.b32n.io could read
# every card its owner has. On its own hostname there is no session to borrow.
#
# Same Worker, because the code and the R2 binding are the same; the isolation
# the browser enforces comes from the hostname, not from the process. The /s/*
# route is the only thing that answers here, and it authenticates with a signed
# URL rather than a cookie. See src/mindbox.ts.
[[routes]]
pattern = "mindbox.b32n.io"
custom_domain = true

[assets]
directory = "../web/dist"
# Unknown paths are client-side routes (/app, /login), so serve the SPA shell
# rather than a 404.
not_found_handling = "single-page-application"
# ...except these, which must reach the Worker. Without this, the SPA fallback
# would swallow the API and every MCP call would get index.html.
# Note what is NOT here: /register. That is the app's sign-up page. The OAuth
# client-registration endpoint lives at /oauth/register precisely so the two
# don't fight over one path.
run_worker_first = [
  "/api/*",
  "/mcp",
  "/oauth/*",
  "/.well-known/*",
  # The mindbox. Without this the SPA fallback answers with index.html and an
  # HTML artefact renders as a copy of the app inside its own frame.
  "/s/*",
  # File downloads, same trap: without it every download is a copy of the app
  # saved under the file's name.
  "/f/*",
]

[[d1_databases]]
binding = "DB"
database_name = "mindmaps"
database_id = "287b8d32-6857-4b3e-8b37-cf4b26032e30"
migrations_dir = "migrations"

# Pasted/dropped images. Locally wrangler simulates this with no real bucket.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "mindmaps-images"

# Artefact payloads (sheets, later docs and decks). A second binding onto the
# same bucket rather than a second bucket: the `artefacts/` key prefix already
# keeps them apart, and this needs no new production resource. Splitting them
# later is a bucket_name change plus a copy.
[[r2_buckets]]
binding = "ARTEFACTS"
bucket_name = "mindmaps-images"

# Semantic recall. Both optional: without them `recall` falls back to keyword
# search, which is how local development runs and how a fresh deploy behaves
# before the index exists.
#
# The index holds one vector per *passage* (`<node_id>#<ord>`), not per card —
# see 0017_chunks.sql. 1024 dimensions to match bge-m3, which replaced the
# 768-dim bge-base-en-v1.5.
#
#   npx wrangler vectorize create mindmaps-chunks --dimensions=1024 --metric=cosine
#
# A new index rather than a reindex of `mindmaps-cards`: dimensions are fixed at
# creation, so a model whose output width changed cannot reuse the old one. The
# old index is left in place until the reindex is confirmed good, then:
#   npx wrangler vectorize delete mindmaps-cards
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORS"
index_name = "mindmaps-chunks"

# Re-embeds cards edited in the browser. The PATCH marks the row and this does
# the inference a minute later, so a typing session — which commits on a 400ms
# debounce — costs one embedding of the final text rather than one per pause.
# See 0018_index_dirty.sql.
[triggers]
crons = ["* * * * *"]

[vars]
# Same origin for all three, which is the point of the layout above.
# PUBLIC_ORIGIN is the OAuth issuer identity: stable, published, and never
# inferred from a request. See issuerOf in src/oauth.ts.
PUBLIC_ORIGIN = "https://mindmaps.b32n.io"
ALLOWED_ORIGIN = "https://mindmaps.b32n.io"
APP_ORIGIN = "https://mindmaps.b32n.io"
MINDBOX_ORIGIN = "https://mindbox.b32n.io"

# Local development overrides these via `worker/.dev.vars`, which wrangler reads
# automatically. A `[env.dev]` block would NOT work: named environments are only
# used with `--env`, and they do not inherit bindings from the top level.

# Secrets — set with `npx wrangler secret put <NAME>`, never committed:
#   GOOGLE_CLIENT_ID       (Google Cloud Console -> OAuth 2.0 Client ID)
#   GOOGLE_CLIENT_SECRET
#   MINDBOX_SECRET         (any long random string; signs mindbox frame URLs)
# Without MINDBOX_SECRET the HTML artefact type is unavailable rather than
# insecure: minting a frame URL 503s and /s/* refuses to serve.
# Google sign-in hides itself when these are absent; email + password works
# without them. The redirect URI to register is:
#   https://mindmaps.b32n.io/api/auth/google/callback
